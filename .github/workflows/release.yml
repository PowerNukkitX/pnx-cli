# Releases on a version bump.
#
# Push a new "version" in packages/cli/package.json to master and this workflow
# checks, builds and publishes @powernukkitx/cli to npm, then the GitHub release
# "cli-vX.Y.Z" with its changelog.
# A version whose tag already exists is skipped, so re-runs are harmless.
# Needs the NPM_TOKEN secret.
#
# The desktop app lives in PowerNukkitX/pnx-app. Its release workflow mirrors
# each app release here as "app-vX.Y.Z" so copies up to 2.4.0, which update
# from this repository, move over.

name: Release

on:
  push:
    branches: [master]
    paths:
      - packages/cli/package.json
      - .github/workflows/release.yml
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  detect:
    name: Detect a new version
    runs-on: ubuntu-latest
    outputs:
      cli_version: ${{ steps.v.outputs.cli_version }}
      cli_new: ${{ steps.v.outputs.cli_new }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: v
        name: Compare the package version with the tags
        run: |
          cli=$(node -p "require('./packages/cli/package.json').version")
          echo "cli_version=$cli" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/cli-v$cli" >/dev/null; then echo "cli_new=false" >> "$GITHUB_OUTPUT"; else echo "cli_new=true" >> "$GITHUB_OUTPUT"; fi
          echo "cli $cli (new: $(git rev-parse -q --verify refs/tags/cli-v$cli >/dev/null && echo no || echo yes))"

  cli-release:
    name: Publish CLI
    needs: detect
    if: needs.detect.outputs.cli_new == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install

      - name: Typecheck, build, smoke test
        run: |
          npm run typecheck --workspace packages/cli
          npm run build --workspace packages/cli
          npm run smoke --workspace packages/cli
          npm run smoke:launcher --workspace packages/cli

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          v="${{ needs.detect.outputs.cli_version }}"
          if [ "$(npm view "@powernukkitx/cli@$v" version 2>/dev/null)" = "$v" ]; then
            echo "@powernukkitx/cli@$v is already on npm, skipping"
            exit 0
          fi
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::The NPM_TOKEN secret is missing (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          npm publish --workspace packages/cli --access public

      - name: Write the changelog
        run: node .github/scripts/changelog.mjs --version "${{ needs.detect.outputs.cli_version }}" > notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.detect.outputs.cli_version }}"
          # never "latest": desktop app copies up to 2.4.0 update from the latest
          # release here, which is the app-v* mirror published by PowerNukkitX/pnx-app
          gh release create "cli-v$v" \
            --target "$GITHUB_SHA" \
            --title "@powernukkitx/cli $v" \
            --notes-file notes.md \
            --latest=false
