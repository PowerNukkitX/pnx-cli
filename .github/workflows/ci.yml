name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Validate CLI (Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck --workspace packages/cli

      - name: Build
        run: npm run build --workspace packages/cli

      - name: Smoke test the CLI
        run: npm run smoke --workspace packages/cli

      - name: Smoke test the launcher
        run: npm run smoke:launcher --workspace packages/cli

      - name: JSON mode answers as one document
        run: node packages/cli/dist/bin/pnx.js --json info
